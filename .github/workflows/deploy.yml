name: "CI/CD Pipeline: Security Audit, Unit Tests, Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Security audit (dependencies and static analysis)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies (pip-audit)
        run: pip-audit || echo "pip-audit completed with security warnings."

      - name: Static security analysis (bandit)
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          continue-on-error: true


  # Job 2: Unit tests
  test:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PINECONE_API_KEY: "test-key"
          PINECONE_INDEX_NAME: "test-index"
          GROQ_API_KEY: "test-key"
          ALLOWED_ORIGINS: "https://romainsebire.fr"
        run: pytest tests/ -v

  # Job 3: Deploy to Render (push on main only)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            echo "Triggering Render deploy hook..."
            curl -sf "$HOOK_URL" || echo "Deploy hook warning: relying on Render native auto-deploy."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Render native GitHub Auto-Deploy will handle the deployment."
          fi

